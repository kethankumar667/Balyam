# coturn configuration for BHALYAM voice.
#
# Replace every <PLACEHOLDER>. The only value that must match the app is
# static-auth-secret, which has to equal TURN_SECRET on the BHALYAM server —
# the server derives credentials from it and coturn recomputes the same HMAC.

listening-port=3478
tls-listening-port=5349

# The public address clients connect to. On a cloud VM whose NIC holds a
# private address, give BOTH as PUBLIC/PRIVATE or every relay candidate will
# advertise an unroutable IP and silently fail.
external-ip=<PUBLIC_IP>
# external-ip=<PUBLIC_IP>/<PRIVATE_IP>

realm=<TURN_HOSTNAME>

# ── Authentication ────────────────────────────────────────────────────
# Time-limited credentials. The app never stores a password; it signs a
# short-lived username with this secret, so a credential lifted from a
# browser expires within the hour.
use-auth-secret
static-auth-secret=<LONG_RANDOM_SECRET>

# ── TLS ───────────────────────────────────────────────────────────────
# turns:// on 5349 is what crosses firewalls that allow only HTTPS-looking
# traffic. Issue certs with certbot for <TURN_HOSTNAME>.
cert=/etc/letsencrypt/live/<TURN_HOSTNAME>/fullchain.pem
pkey=/etc/letsencrypt/live/<TURN_HOSTNAME>/privkey.pem

# ── Relay port range ──────────────────────────────────────────────────
# Must be open in the VPS firewall AND any cloud security group. A narrower
# range than the default is easier to reason about and plenty for this size
# of deployment.
min-port=49160
max-port=49200

# ── Hardening ─────────────────────────────────────────────────────────
# Without these your relay can be used to reach hosts inside your own
# network, and to bounce traffic at third parties. This is the single most
# important block in the file.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Old and unauthenticated paths, off.
no-cli
no-tlsv1
no-tlsv1_1
fingerprint

# Cap what one client can hold, so a bug or an abuser cannot exhaust the box.
user-quota=12
total-quota=100

# Keep logs on stdout for `docker compose logs`.
log-file=stdout
simple-log
