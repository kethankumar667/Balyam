# ==============================================================================
# BHALYAM Automated Quality Gates & CI Pipeline
# Multi-stage release verification ensuring zero regressions reach production.
# ==============================================================================
name: CI & Quality Gates

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Strict TypeScript Compilation
        run: npm run typecheck

      - name: Automated Unit & Stress Tests (Vitest)
        run: npm test

      - name: Build & Alias Resolution
        run: npm run build

  client:
    name: Client Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Strict TypeScript Compilation
        run: npm run typecheck

      - name: Automated Unit Tests (Vitest)
        run: npm test

      - name: Production Bundle & Prerender
        run: npm run build

  quality-gates:
    name: Release Quality Gates
    needs: [server, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install Server Dependencies
        run: npm --prefix server ci

      - name: Install Client Dependencies
        run: npm --prefix client ci

      - name: Build Client & Server
        run: |
          npm --prefix server run build
          npm --prefix client run build

      - name: Gate 1 — Test Quality & Anti-Skip Guard
        run: node scripts/quality-gates/testQualityAudit.mjs

      - name: Gate 2 — Bundle Size Budgets
        run: node scripts/quality-gates/bundleBudgetGuard.mjs

      - name: Gate 3 — WCAG Accessibility Standards (A11y)
        run: node scripts/quality-gates/accessibilityAudit.mjs

      - name: Gate 4 — Dependency Governance
        run: node scripts/quality-gates/dependencyGovernance.mjs

      - name: Gate 5 — Consolidated Release Readiness Report
        run: node scripts/quality-gates/releaseReadinessReport.mjs

      - name: Upload Release Readiness Report
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-report
          path: RELEASE_READINESS_REPORT.json
