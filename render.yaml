services:
  # ── BHALYAM Backend (Node.js + Express + Socket.IO) ────────────────────────
  - type: web
    name: bhalyam-backend
    runtime: node
    plan: free
    rootDir: server
    # `--include=dev` is required: NODE_ENV=production (set below, and needed at runtime) also applies
    # during the build, and then a plain `npm install` skips devDependencies — typescript's
    # @types/express and @types/node, vitest, tsc-alias — so `tsc` fails to compile the server.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: ROOM_SNAPSHOT_STORE
        value: supabase # Apply 20261109000000_room_snapshots.sql before deploying.
      - key: CLIENT_ORIGIN
        sync: false # Set to frontend URL (e.g. https://bhalyam.onrender.com)
      - key: TRUST_PROXY_HOPS
        value: 1 # Render puts ONE proxy in front. Must be a whole number, not `true`: without it every visitor looks like the proxy and the per-IP limits share one bucket.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Service-role (secret) key — required for durable progression. NOT the anon key. Never commit the real value.
      - key: OPERATIONAL_SECRET
        sync: false # Required in production — server refuses to boot without it. Generate fresh per deployment, never reuse the local dev placeholder.
      - key: SESSION_SECRET
        sync: false # Signs guest tokens. Without it, a restart signs every guest out and orphans their progression.

  # ── BHALYAM Frontend (React 18 + Vite SPA) ─────────────────────────────────
  - type: web
    name: bhalyam-frontend
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # ── Prerendered routes must be listed BEFORE the SPA catch-all ────────
      #
      # `npm run build` writes one static file per public route
      # (dist/about/index.html, dist/games/index.html, …). Render serves a
      # real file in preference to a rewrite — /about/index.html and /about/
      # both return the right page — but it does NOT resolve a directory
      # index for an extensionless path. So plain `/about` matches no file,
      # falls through to the catch-all below, and every crawler is served the
      # HOMEPAGE with the homepage's title and canonical.
      #
      # That failure is invisible in a browser, because React Router corrects
      # the view the moment JavaScript boots. Only the raw response is wrong,
      # which is exactly the audience prerendering exists for. Rules are
      # evaluated in order and the first match wins, so these must stay above
      # the catch-all. Add a line here whenever PUBLIC_ROUTES gains one.
      - type: rewrite
        source: /games
        destination: /games/index.html
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /privacy
        destination: /privacy/index.html
      - type: rewrite
        source: /login
        destination: /login/index.html
      - type: rewrite
        source: /signup
        destination: /signup/index.html
      - type: rewrite
        source: /forgot-password
        destination: /forgot-password/index.html
      - type: rewrite
        source: /reset-password
        destination: /reset-password/index.html
      - type: rewrite
        source: /verify-email
        destination: /verify-email/index.html
      - type: redirect
        source: /nokiacricket
        destination: /cricket2d
      - type: rewrite
        source: /snake
        destination: /snake/index.html
      - type: rewrite
        source: /brickracer
        destination: /brickracer/index.html
      - type: rewrite
        source: /brickblocks
        destination: /brickblocks/index.html
      - type: redirect
        source: /tetris
        destination: /brickblocks
      - type: rewrite
        source: /breakout
        destination: /breakout/index.html
      - type: rewrite
        source: /how-to-play
        destination: /how-to-play/index.html
      - type: rewrite
        source: /support
        destination: /support/index.html
      - type: rewrite
        source: /contact
        destination: /contact/index.html
      - type: rewrite
        source: /reviews/write
        destination: /reviews/write/index.html
      - type: rewrite
        source: /feedback
        destination: /feedback/index.html
      - type: rewrite
        source: /testimonials
        destination: /testimonials/index.html
      - type: rewrite
        source: /terms
        destination: /terms/index.html
      - type: rewrite
        source: /safety
        destination: /safety/index.html
      - type: rewrite
        source: /community-rules
        destination: /community-rules/index.html
      - type: rewrite
        source: /myrecords
        destination: /myrecords/index.html
      - type: rewrite
        source: /tournaments
        destination: /tournaments/index.html
      - type: rewrite
        source: /social
        destination: /social/index.html
      - type: rewrite
        source: /favorites
        destination: /favorites/index.html
      - type: rewrite
        source: /recently-played
        destination: /recently-played/index.html
      - type: rewrite
        source: /design-system
        destination: /design-system/index.html
      - type: rewrite
        source: /cricket2d
        destination: /cricket2d/index.html
      - type: redirect
        source: /nokiasnake
        destination: /snake
      - type: rewrite
        source: /snake2d
        destination: /snake2d/index.html
      - type: redirect
        source: /roadrash
        destination: /brickracer
      - type: rewrite
        source: /racer
        destination: /racer/index.html
      - type: redirect
        source: /bricktetris
        destination: /brickblocks
      - type: rewrite
        source: /pentix
        destination: /pentix/index.html
      - type: rewrite
        source: /brickbreakout
        destination: /brickbreakout/index.html
      - type: rewrite
        source: /brick-breakout
        destination: /brick-breakout/index.html
      - type: rewrite
        source: /blockbreakout
        destination: /blockbreakout/index.html
      - type: rewrite
        source: /home
        destination: /home/index.html
      - type: rewrite
        source: /2048
        destination: /2048/index.html
      - type: rewrite
        source: /sudoku
        destination: /sudoku/index.html
      - type: rewrite
        source: /goli-jump
        destination: /goli-jump/index.html
      # Goli Jump was called Brain Vita. The old address redirects, permanently, so links and search results follow.
      - type: redirect
        source: /brainvita
        destination: /goli-jump

      # Single Page Application (SPA) catch-all rewrite for deep links &
      # refreshes. Everything dynamic lands here — /room/:code, /tv/:code,
      # /profile — and is rendered by React Router after boot.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Tell browsers to use HTTPS only, for a year. No includeSubDomains / preload: those are hard to take back.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      # The microphone is for voice chat and the camera for the QR scanner; nothing here uses location.
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(self), geolocation=(), interest-cohort=()
      # REPORT-ONLY on purpose: it blocks nothing, it only logs what it WOULD block to the browser console, so it
      # cannot break the site. Browse the app with DevTools open; when no violations show, rename the header to
      # Content-Security-Policy to enforce it. Why this matters: sign-in tokens live in localStorage, so a
      # script that runs from anywhere else could read them.
      #   - Google Fonts load from fonts.googleapis.com / fonts.gstatic.com; Google profile pictures from
      #     lh3.googleusercontent.com.
      #   - The app talks to the backend (HTTPS + the socket's WSS) and to Supabase (*.supabase.co).
      #   - 'unsafe-inline' for styles only: the UI sets inline style attributes.
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://lh3.googleusercontent.com; media-src 'self' blob: data:; connect-src 'self' https://bhalyam-backend.onrender.com wss://bhalyam-backend.onrender.com https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_SERVER_URL
        sync: false # Set to backend URL (e.g. https://bhalyam-backend.onrender.com)
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_PRIVACY_CONTACT_EMAIL
        sync: false # Set to monitored privacy/grievance inbox (e.g. privacy@bhalyam.com)
